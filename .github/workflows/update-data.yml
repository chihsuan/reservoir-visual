name: Update Reservoir Data

on:
  schedule:
    - cron: '0 * * * *'   # Every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reservoir-visual
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Update reservoir data
        run: python3 update_data.py

      - name: Validate data
        run: |
          python3 -c "
          import json
          data = json.load(open('data/data.json'))
          assert isinstance(data, dict), 'data.json must be a dict'
          assert len(data) >= 10, f'Expected >=10 reservoirs, got {len(data)}'
          print(f'Validated: {len(data)} reservoirs')
          "

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update reservoir data"
            git push
          fi
